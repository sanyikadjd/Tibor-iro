<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nagykutasi Tibor – író</title>
<meta name="description" content="Nagykutasi Tibor író hivatalos oldala: Ébredés, Kárpátium, Mindent tudunk. Ennek ellenére...">
<style>
:root{--bg:#eef1ee;--surface:#fff;--ink:#17211f;--mute:#5a6a66;--line:#d3dbd7;--pine:#1f4d45;--gold:#c8963e;--on-pine:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1614;--surface:#16211e;--ink:#e8eeec;--mute:#93a39f;--line:#2a3a36;--pine:#5fb3a2;--gold:#d9a94f;--on-pine:#0e1614}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.brand{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
a{color:var(--pine)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px 0}
.brand{font-size:1.25rem;color:var(--ink);text-decoration:none;display:block;margin:0 0 4px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;text-decoration:none;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
nav a.on{color:var(--ink);border-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.hero{padding:34px 0 30px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-size:clamp(2.1rem,9vw,3.6rem);letter-spacing:-.01em}
.hero p{font-family:"Iowan Old Style",Georgia,serif;font-size:1.25rem;font-style:italic;color:var(--mute);margin:0 0 20px}
.btn{display:inline-block;background:var(--pine);color:var(--on-pine);border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.del{background:transparent;color:#b3372f;border:1px solid #b3372f}
section{margin-bottom:34px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--pine)}
.card h3{font-size:1.15rem;margin-bottom:.3em}
.card p{margin:0}
.book{border-left:4px solid var(--gold)}
small,.meta{color:var(--mute);font-size:.85rem}
.prose{font-family:"Iowan Old Style",Georgia,serif;font-size:1.12rem;line-height:1.75}
form{display:grid;gap:10px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
textarea{min-height:110px;resize:vertical}
label{font-size:.9rem;color:var(--mute);display:grid;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cm{border-top:1px solid var(--line);padding:12px 0}
.cm p{margin:.2em 0 0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--mute)}
footer{max-width:760px;margin:0 auto;padding:20px 18px 40px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header><a class="brand" href="#/">Nagykutasi Tibor</a><nav id="nav"></nav></header>
<main id="app"><p class="note">Betöltés...</p></main>
<footer><span>Nagykutasi Tibor, író</span><a href="#/admin" id="adm">Admin</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://ycbexkvxnnhqukohewby.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljYmV4a3Z4bm5ocXVrb2hld2J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjI5ODcsImV4cCI6MjEwNjUzODk4N30.m3ssJQLYg8XSYWXejNSfKTQ0bTa7zF63kXygrZy2Mlc";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const dt = d => new Date(d).toLocaleDateString('hu-HU', {year:'numeric', month:'long', day:'numeric'});
const DEF = {
  hero_title: 'Nagykutasi Tibor',
  hero_text: 'Mindent tudunk. Ennek ellenére...',
  about: 'Ide kerül a bemutatkozás. Az admin felületen bármikor átírható.',
  books: 'Ébredés | Leírás hamarosan.\nKárpátium | Leírás hamarosan.\nMindent tudunk. Ennek ellenére... | Leírás hamarosan.'
};
let me = null, admin = false, C = {...DEF};

async function checkAdmin() {
  admin = false;
  if (me && !me.is_anonymous) { const {data} = await sb.rpc('is_admin'); admin = data === true; }
}
async function ensureUser() {
  if (me) return true;
  const {data, error} = await sb.auth.signInAnonymously();
  if (error) { alert('Nem sikerült: ' + error.message); return false; }
  me = data.user; return true;
}
const getName = () => localStorage.getItem('nick') || '';
const saveName = n => localStorage.setItem('nick', n.trim());
const canDel = r => admin || (me && r.user_id === me.id);

function books() {
  return C.books.split('\n').filter(l => l.trim()).map(l => {
    const [t, ...d] = l.split('|');
    return `<div class="card book"><h3>${esc(t.trim())}</h3><p>${esc(d.join('|').trim())}</p></div>`;
  }).join('');
}
const postCard = p => `<a class="card" href="#/tema/${p.id}"><small>${p.kind === 'news' ? 'Hír' : 'Téma'} – ${esc(p.author_name)}, ${dt(p.created_at)}</small><h3>${esc(p.title)}</h3></a>`;

async function listPosts(kind, limit) {
  let q = sb.from('posts').select('*').order('created_at', {ascending: false});
  if (kind) q = q.eq('kind', kind);
  if (limit) q = q.limit(limit);
  const {data} = await q; return data || [];
}

const pages = {
  async ''() {
    const news = await listPosts('news', 3);
    return `<div class="hero"><h1>${esc(C.hero_title)}</h1><p>${esc(C.hero_text)}</p>
      <a class="btn" href="#/konyvek">Könyvek</a> <a class="btn ghost" href="#/kozosseg">Beszélgetés az olvasókkal</a></div>
      <section><h2>Legfrissebb hírek</h2>${news.map(postCard).join('') || '<p class="note">Még nincs hír.</p>'}</section>
      <section><h2>Könyvek</h2>${books()}</section>`;
  },
  async konyvek() { return `<h1>Könyvek</h1>${books()}`; },
  async rolam() { return `<h1>Rólam</h1><div class="prose">${br(C.about)}</div>`; },
  async hirek() {
    const news = await listPosts('news');
    return `<h1>Hírek</h1>${news.map(postCard).join('') || '<p class="note">Még nincs hír.</p>'}`;
  },
  async kozosseg() {
    const th = await listPosts('thread');
    return `<h1>Közösség</h1>
      <section><form id="nt">
        <label>Becenév (nem kötelező)<input id="nm" maxlength="40" placeholder="Névtelen" value="${esc(getName())}"></label>
        <label>Téma címe<input id="tt" maxlength="150" required></label>
        <label>Üzenet<textarea id="tb" maxlength="5000"></textarea></label>
        <button class="btn">Téma indítása</button></form></section>
      <section>${th.map(postCard).join('') || '<p class="note">Még nincs téma. Indítsd el az első beszélgetést!</p>'}</section>`;
  },
  async tema(id) {
    const {data: p} = await sb.from('posts').select('*').eq('id', id).single();
    if (!p) return '<p class="note">Ez a bejegyzés nem található.</p>';
    const {data: cs} = await sb.from('comments').select('*').eq('post_id', id).order('created_at');
    return `<small>${p.kind === 'news' ? 'Hír' : 'Téma'} – ${esc(p.author_name)}, ${dt(p.created_at)}</small>
      <h1>${esc(p.title)}</h1><div class="prose">${br(p.body)}</div>
      ${p.file_url ? `<p><a class="btn ghost" href="${esc(p.file_url)}" target="_blank" rel="noopener">Csatolt fájl megnyitása</a></p>` : ''}
      ${canDel(p) ? `<p><button class="btn del small" data-delpost="${p.id}" data-kind="${p.kind}">Bejegyzés törlése</button></p>` : ''}
      <section><h2>Hozzászólások (${(cs||[]).length})</h2>
      ${(cs||[]).map(c => `<div class="cm"><small>${esc(c.author_name)}, ${dt(c.created_at)}</small><p>${br(c.body)}</p>
        ${canDel(c) ? `<button class="btn del small" data-delcm="${c.id}">Törlés</button>` : ''}</div>`).join('')}
      <form id="nc" data-post="${p.id}" style="margin-top:14px">
        <label>Becenév (nem kötelező)<input id="nm" maxlength="40" placeholder="Névtelen" value="${esc(getName())}"></label>
        <label>Hozzászólás<textarea id="cb" maxlength="2000" required></textarea></label>
        <button class="btn">Hozzászólok</button></form></section>`;
  },
  async admin() {
    if (!admin) return `<h1>Admin belépés</h1><form id="lg"><label>Email<input id="em" type="email" required autocomplete="username"></label>
      <label>Jelszó<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">Belépés</button></form>`;
    return `<h1>Admin felület</h1><div class="row"><button class="btn ghost small" id="out">Kilépés</button></div>
      <section><h2>Oldal szövegei</h2><form id="ct">
        <label>Főoldal címe<input name="hero_title" value="${esc(C.hero_title)}"></label>
        <label>Főoldal alcíme<input name="hero_text" value="${esc(C.hero_text)}"></label>
        <label>Rólam szöveg<textarea name="about" style="min-height:200px">${esc(C.about)}</textarea></label>
        <label>Könyvek (soronként: Cím | leírás)<textarea name="books" style="min-height:150px">${esc(C.books)}</textarea></label>
        <button class="btn">Szövegek mentése</button></form></section>
      <section><h2>Új hír közzététele</h2><form id="nn">
        <label>Cím<input id="nt2" maxlength="150" required></label>
        <label>Szöveg<textarea id="nb" maxlength="5000"></textarea></label>
        <label>Fájl csatolása (nem kötelező)<input id="nf" type="file"></label>
        <button class="btn">Közzététel</button></form></section>`;
  }
};

async function route() {
  const parts = location.hash.slice(2).split('/');
  const key = parts[0] || '';
  const fn = pages[key] || pages[''];
  const links = [['', 'Főoldal'], ['konyvek', 'Könyvek'], ['rolam', 'Rólam'], ['hirek', 'Hírek'], ['kozosseg', 'Közösség']];
  $('#nav').innerHTML = links.map(([k, t]) => `<a href="#/${k}" class="${k === key || (key === 'tema' && k === 'kozosseg') ? 'on' : ''}">${t}</a>`).join('');
  $('#app').innerHTML = '<p class="note">Betöltés...</p>';
  try { $('#app').innerHTML = await fn(parts[1]); }
  catch (e) { $('#app').innerHTML = '<p class="note">Hiba történt az oldal betöltésekor. Próbáld újra később.</p>'; }
  window.scrollTo(0, 0);
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, id = f.id, btn = f.querySelector('button'); btn.disabled = true;
  try {
    if (id === 'lg') {
      const {data, error} = await sb.auth.signInWithPassword({email: $('#em').value, password: $('#pw').value});
      if (error) throw new Error('Hibás email vagy jelszó.');
      me = data.user; await checkAdmin();
      if (!admin) { await sb.auth.signOut(); me = null; throw new Error('Ehhez a fiókhoz nincs admin jog.'); }
    }
    if (id === 'ct') {
      const rows = [...new FormData(f)].map(([key, value]) => ({key, value, updated_at: new Date().toISOString()}));
      const {error} = await sb.from('site_content').upsert(rows); if (error) throw error;
      rows.forEach(r => C[r.key] = r.value); alert('Elmentve.');
    }
    if (id === 'nn') {
      let file_url = null; const file = $('#nf').files[0];
      if (file) {
        const path = Date.now() + '-' + file.name.replace(/[^\w.\-]/g, '_');
        const {error} = await sb.storage.from('uploads').upload(path, file); if (error) throw error;
        file_url = sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
      }
      const {error} = await sb.from('posts').insert({author_name: 'Nagykutasi Tibor', kind: 'news', title: $('#nt2').value, body: $('#nb').value, file_url});
      if (error) throw error; location.hash = '#/hirek';
    }
    if (id === 'nt') {
      if (!await ensureUser()) return; saveName($('#nm').value);
      const {error} = await sb.from('posts').insert({author_name: getName() || 'Névtelen', kind: 'thread', title: $('#tt').value, body: $('#tb').value});
      if (error) throw error;
    }
    if (id === 'nc') {
      if (!await ensureUser()) return; saveName($('#nm').value);
      const {error} = await sb.from('comments').insert({post_id: +f.dataset.post, author_name: getName() || 'Névtelen', body: $('#cb').value});
      if (error) throw error;
    }
    route();
  } catch (err) { alert(err.message || 'Valami nem sikerült.'); btn.disabled = false; }
});

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'out') { await sb.auth.signOut(); me = null; admin = false; location.hash = '#/'; route(); }
  if (t.dataset.delcm && confirm('Biztosan törlöd ezt a hozzászólást?')) { await sb.from('comments').delete().eq('id', t.dataset.delcm); route(); }
  if (t.dataset.delpost && confirm('Biztosan törlöd ezt a bejegyzést a hozzászólásaival együtt?')) {
    await sb.from('posts').delete().eq('id', t.dataset.delpost);
    location.hash = t.dataset.kind === 'news' ? '#/hirek' : '#/kozosseg';
  }
});

window.addEventListener('hashchange', route);
(async () => {
  const {data: {session}} = await sb.auth.getSession(); me = session?.user || null;
  await checkAdmin();
  const {data} = await sb.from('site_content').select('*'); (data || []).forEach(r => C[r.key] = r.value);
  route();
})();
</script>
</body>
</html>
